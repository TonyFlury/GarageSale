{% if contributor.sponsor_status == "Confirmed" %}
    <span title="Sponsorship confirmed for this event">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803d"
         stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <title>Confirmed</title>
        <path d="M5 12l4 4L19 6" />
    </svg>
    {% if contributor.sponsor_cash_donated %}
        Cash Donation
    {% elif contributor.sponsor_noncash_donated %}
        non-cash Donation
    {% else %}
        Confirmed
    {% endif %}
    </span>
{% endif %}
