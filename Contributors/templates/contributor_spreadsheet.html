<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Contributor Spreadsheet Editor</title>
    <script src="{% static 'Contributors/js/contributor_spreadsheet.js' %}" defer></script>

    <style>
        .spreadsheet-page {
            max-width: 1400px;
            margin: 2rem auto;
            font-family: Arial, sans-serif;
        }

        .filters {
            display: grid;
            grid-template-columns: repeat(4, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .filters label {
            display: flex;
            flex-direction: column;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .filters input {
            margin-top: 0.35rem;
            padding: 0.4rem;
        }

        table.contributor-sheet {
            width: 100%;
            border-collapse: collapse;
        }

        .contributor-sheet th,
        .contributor-sheet td {
            border: 1px solid #ccc;
            padding: 0.35rem;
            vertical-align: top;
        }

        .contributor-sheet th {
            background: #f4f4f4;
            text-align: left;
        }

        .contributor-sheet input,
        .contributor-sheet textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid transparent;
            background: transparent;
            padding: 0.25rem;
            font: inherit;
        }

        .contributor-sheet textarea {
            min-height: 3rem;
            resize: vertical;
        }

        .contributor-sheet tr.locked input,
        .contributor-sheet tr.locked textarea {
            color: #555;
            cursor: not-allowed;
        }

        .contributor-sheet tr.unlocked {
            background: #fffdf2;
        }

        .contributor-sheet tr.dirty {
            background: #fff3cd;
        }

        .contributor-sheet tr.invalid {
            background: #f8d7da;
        }

        .field-error {
            display: block;
            color: #842029;
            font-size: 0.78rem;
            margin-top: 0.2rem;
        }

        .row-status {
            font-weight: bold;
            white-space: nowrap;
        }

        .row-status.locked {
            color: #555;
        }

        .row-status.unlocked {
            color: #0d6efd;
        }

        .row-status.dirty {
            color: #b58100;
        }

        .row-status.saved {
            color: #198754;
        }

        .row-status.invalid {
            color: #842029;
        }

        .description-cell {
            display: grid;
            grid-template-columns: minmax(10rem, 1fr) auto;
            gap: 0.35rem;
            align-items: start;
        }

        .description-preview {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-description {
            padding: 0.25rem 0.45rem;
            cursor: pointer;
        }

        tr.locked .edit-description {
            cursor: not-allowed;
        }

        .description-editor-dialog {
            border: 1px solid #999;
            border-radius: 0.4rem;
            padding: 1rem;
            max-width: 90vw;
        }

        .description-editor-dialog::backdrop {
            background: rgb(0 0 0 / 0.35);
        }

        .description-editor-dialog form {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        #description-editor-textarea {
            width: auto;
            min-width: 50ch;
            max-width: 80vw;
            height: auto;
            min-height: 5lh;
            overflow: auto;
            resize: both;
            font: inherit;
            padding: 0.4rem;
            box-sizing: border-box;
        }

        .description-editor-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .description-editor-actions {
            display: flex;
            gap: 0.5rem;
        }


        .actions {
            display: flex;
            gap: 0.4rem;
        }

        .actions button {
            cursor: pointer;
            padding: 0.35rem 0.55rem;
        }

        .save-row {
            display: none;
        }

        tr.dirty .save-row,
        tr.invalid .save-row,
        tr.new-row .save-row {
            display: inline-block;
        }
    </style>
</head>
<body>
<main class="spreadsheet-page">
    <h1>Contributor Spreadsheet Editor</h1>

    <section class="filters" aria-label="Contributor filters">
        <label>
            Company name
            <input type="search" data-filter-field="contributor_name" placeholder="Filter company name">
        </label>

        <label>
            Contact name
            <input type="search" data-filter-field="contact_name" placeholder="Filter contact name">
        </label>

        <label>
            Email
            <input type="search" data-filter-field="email" placeholder="Filter email">
        </label>

        <label>
            Description
            <input type="search" data-filter-field="description" placeholder="Filter description">
        </label>
    </section>

    <table class="contributor-sheet"
           id="contributor-sheet"
            data-create-url="{% url 'contributors:spreadsheet_create' %}">
        <thead>
        <tr>
            <th>Status</th>
            <th>Type</th>
            <th>Company name</th>
            <th>Contact name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        {% for contributor in contributors %}
            <tr
                class="locked"
                data-contributor-id="{{ contributor.pk }}"
                data-save-url="{% url 'contributors:spreadsheet_save' contributor.pk %}"
                data-filter-contributor_name="{{ contributor.contributor_name|default_if_none:''|lower }}"
                data-filter-contact_name="{{ contributor.contact_name|default_if_none:''|lower }}"
                data-filter-email="{{ contributor.email|default_if_none:''|lower }}"
                data-filter-description="{{ contributor.description|default_if_none:''|lower }}"
            >
                <td>
                    <span class="row-status locked">Locked</span>
                </td>

                <td>
                    <input
                        name="contributor_type"
                        value="{{ contributor.contributor_type }}"
                        maxlength="30"
                        required
                        disabled
                    >
                    <span class="field-error" data-error-for="contributor_type"></span>
                </td>

                <td>
                    <input
                        name="contributor_name"
                        value="{{ contributor.contributor_name }}"
                        maxlength="120"
                        required
                        disabled
                    >
                    <span class="field-error" data-error-for="contributor_name"></span>
                </td>

                <td>
                    <input
                        name="contact_name"
                        value="{{ contributor.contact_name }}"
                        maxlength="120"
                        disabled
                    >
                    <span class="field-error" data-error-for="contact_name"></span>
                </td>

                <td>
                    <input
                        name="phone"
                        value="{{ contributor.phone }}"
                        maxlength="12"
                        disabled
                    >
                    <span class="field-error" data-error-for="phone"></span>
                </td>

                <td>
                    <input
                        name="email"
                        type="email"
                        value="{{ contributor.email|default_if_none:'' }}"
                        maxlength="254"
                        disabled
                    >
                    <span class="field-error" data-error-for="email"></span>
                </td>

                              <td>
                    <div class="description-cell">
                        <input
                            name="description"
                            class="description-preview"
                            value="{{ contributor.description }}"
                            maxlength="1000"
                            readonly
                            disabled
                            title="{{ contributor.description }}"
                        >
                        <button
                            type="button"
                            class="edit-description"
                            disabled
                        >
                            Edit
                        </button>
                    </div>
                    <span class="field-error" data-error-for="description"></span>
                </td>

                <td>
                    <div class="actions">
                        <button type="button" class="unlock-row">Unlock</button>
                        <button type="button" class="save-row">Save</button>
                    </div>
                </td>
            </tr>
        {% empty %}
            <tr>
                <td colspan="8">No contributors found.</td>
            </tr>
        {% endfor %}
        </tbody>
      <tr
                class="unlocked new-row dirty"
                data-is-new="true"
                data-filter-contributor_name=""
                data-filter-contact_name=""
                data-filter-email=""
                data-filter-description=""
            >
                <td>
                    <span class="row-status dirty">New - save required</span>
                </td>

                <td>
                    <input
                        name="contributor_type"
                        value=""
                        maxlength="30"
                        required
                    >
                    <span class="field-error" data-error-for="contributor_type"></span>
                </td>

                <td>
                    <input
                        name="contributor_name"
                        value=""
                        maxlength="120"
                        required
                    >
                    <span class="field-error" data-error-for="contributor_name"></span>
                </td>

                <td>
                    <input
                        name="contact_name"
                        value=""
                        maxlength="120"
                    >
                    <span class="field-error" data-error-for="contact_name"></span>
                </td>

                <td>
                    <input
                        name="phone"
                        value=""
                        maxlength="12"
                    >
                    <span class="field-error" data-error-for="phone"></span>
                </td>

                <td>
                    <input
                        name="email"
                        type="email"
                        value=""
                        maxlength="254"
                    >
                    <span class="field-error" data-error-for="email"></span>
                </td>

                <td>
                    <div class="description-cell">
                        <input
                            name="description"
                            class="description-preview"
                            value=""
                            maxlength="1000"
                            readonly
                            title=""
                        >
                        <button
                            type="button"
                            class="edit-description"
                        >
                            Edit
                        </button>
                    </div>
                    <span class="field-error" data-error-for="description"></span>
                </td>

                <td>
                    <div class="actions">
                        <button type="button" class="unlock-row" disabled>Unlocked</button>
                        <button type="button" class="save-row">Save</button>
                    </div>
                </td>
            </tr>
    </table>
    <dialog id="description-editor-dialog" class="description-editor-dialog">
        <form method="dialog">
            <h2>Edit description</h2>

            <label for="description-editor-textarea">
                Description
            </label>

            <textarea
                id="description-editor-textarea"
                rows="5"
                cols="50"
                maxlength="1000"
            ></textarea>

            <div class="description-editor-footer">
                <span id="description-editor-count">0 / 1000</span>

                <div class="description-editor-actions">
                    <button type="button" id="description-editor-apply">
                        Apply
                    </button>

                    <button type="button" id="description-editor-cancel">
                        Cancel
                    </button>
                </div>
            </div>
        </form>
    </dialog>
</main>
</body>
</html>
