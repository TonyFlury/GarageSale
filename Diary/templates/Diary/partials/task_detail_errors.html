{# DV1-032, DV1-036, DV1-037: Keep all bound field and form errors visible. #}
<div class="diary-detail-errors" role="alert">
    {% for error in form.non_field_errors %}<p class="diary-detail-field-error">{{ error }}</p>{% endfor %}
    {% for field in form %}{% for error in field.errors %}<p class="diary-detail-field-error">{{ field.label }}: {{ error }}</p>{% endfor %}{% endfor %}
</div>
