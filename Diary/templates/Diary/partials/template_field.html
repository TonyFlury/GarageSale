<div class="diary-template-field{% if field.errors %} diary-template-field-invalid{% endif %}">
    <label class="diary-field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="diary-required"> (required)</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="diary-field-help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<ul class="diary-field-errors" role="alert">{% for error in field.errors %}<li class="diary-field-error">{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
